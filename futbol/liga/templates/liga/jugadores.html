<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jugadores</title>
</head>
<body>
    <h1>Jugadores</h1>

    {% for jugador in jugadores %}
        <h2>{{ jugador.nombre }}</h2>
        <p>Posición: {{ jugador.posicion }}</p>
        <p>Edad: {{ jugador.edad }}</p>
        <p>Equipo: {{ jugador.equipo }}</p>
        <hr>
    {% endfor %}
</body>
</html>
